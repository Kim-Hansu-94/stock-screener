name: Real Estate Collector

# 주식 파이프라인과 분리해서 돈다. 실거래는 신고 기한이 30일이라 매일 볼 이유가
# 없고, 무엇보다 부동산 수집이 실패했다고 주식 스크리닝까지 죽으면 안 된다.
on:
  schedule:
    # 매주 월요일 20:10 UTC (화요일 05:10 KST) — 주식 파이프라인(21:30 UTC)과
    # 겹치지 않는 시각. :00/:30을 피해 잡았다.
    - cron: '10 20 * * 1'
  workflow_dispatch:
    inputs:
      months:
        description: '거슬러 훑을 개월 수 (첫 실행 과거 채우기는 36 권장)'
        type: string
        default: '3'
      probe:
        description: '지역코드 스캔 (예: 28 또는 28,41). 넣으면 수집 대신 스캔만 한다'
        type: string
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    # 36개월 백필은 5,544번 호출이라 한 시간을 넘긴다(첫 시도가 60분에서 잘렸다).
    # 주간 정기 실행은 3개월치라 10분 안쪽이므로 이 값이 커도 손해는 없다.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > pipeline/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> pipeline/.env
          echo "MOLIT_API_KEY=${{ secrets.MOLIT_API_KEY }}" >> pipeline/.env

      - name: Check MOLIT_API_KEY
        # 키가 없으면 수집기는 조용히 건너뛰고 정상 종료한다. 그러면 실행이 40초 만에
        # 초록불로 끝나서 "다 됐다"로 보이는데 실제로는 아무것도 안 쌓인다 — 실제로
        # 첫 실행(run 32458056411)이 그렇게 끝났다. 여기서 먼저 걸러 이유를 분명히 한다.
        # 값은 절대 출력하지 않는다. 길이만 보면 "등록했는데 빈 값" / "이름이 다름"을
        # 구분하는 데 충분하다.
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: |
          if [ -z "$MOLIT_API_KEY" ]; then
            echo "::error::MOLIT_API_KEY 시크릿이 비어 있습니다. Settings → Secrets and variables → Actions → Repository secrets에 이 이름 그대로 등록했는지 확인하세요 (Environment/Dependabot secrets는 이 워크플로가 못 읽습니다)."
            exit 1
          fi
          echo "MOLIT_API_KEY 확인됨 (길이 ${#MOLIT_API_KEY}자)"

      - name: Collect
        working-directory: pipeline
        run: |
          if [ -n "${{ github.event.inputs.probe }}" ]; then
            python -m src.realestate_main --probe "${{ github.event.inputs.probe }}"
          else
            python -m src.realestate_main --months ${{ github.event.inputs.months || '3' }}
          fi
