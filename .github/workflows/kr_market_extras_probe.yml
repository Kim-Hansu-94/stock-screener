name: KR Market Extras Source Probe

# 수동 실행 전용 진단. 작업용 컨테이너는 네이버·DART 네트워크가 막혀 있어
# 소스가 살아 있는지 거기서 확인할 수 없다 — 수집 워크플로를 돌려가며 확인하는
# 대신 여기서 1분 만에 소스별 결과를 본다 (universe_probe.yml과 같은 방식).
on:
  workflow_dispatch:
  # 수집 코드를 건드리면 자동으로 한 번 두드려 본다 — 내부 API가 조용히 막히는 게
  # 이 종류 소스의 고질적인 실패 방식이라, 고친 직후 실제로 되는지 확인하지 않으면
  # 또 몇 주를 모르고 지나간다.
  push:
    paths:
      - 'pipeline/src/investor_flow.py'
      - 'pipeline/src/consensus.py'
      - 'pipeline/src/buyback.py'
      - 'pipeline/src/naver_api.py'
      - '.github/workflows/kr_market_extras_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Probe KR extras sources
        working-directory: pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TQDM_DISABLE: '1'
        run: python -m src.kr_market_extras_probe
