name: Real Estate Media Collector

# 부동산 실거래 수집(realestate.yml, 주 1회)·주식 파이프라인과 모두 분리해서
# 매일 돈다. 뉴스·유튜브는 신선도가 생명이라 매일 갱신해야 하지만, 이 수집이
# 실패했다고 다른 파이프라인까지 죽으면 안 된다.
on:
  schedule:
    # 4시간마다(하루 6회) — 하루 1회로는 오전 4시 이후에 나온 뉴스·영상이 다음날까지
    # 안 보이는 게 아쉽다는 요청으로 늘렸다(2026-09-06). 매 실행이 통째로 갈아끼우는
    # "오늘의 스냅샷"이라(realestate_media.py 참고, 날짜별 이력 없음) 자주 돌수록
    # 단순히 더 최신 상태가 보인다.
    #
    # 05:15/09:15/13:15/17:15/21:15/01:15 KST(=UTC 00/04/08/12/16/20시 15분)로
    # 잡아 주식 파이프라인의 아침 전체(06:30)·백업(08:00·11:00)·저녁 KR 전용
    # (16:30)·US 재무건전성(21:00)·백업(22:00) 시각과 정확히 겹치지 않게 했다
    # (완전히 피할 수는 없어 05:15·13:15는 여유가 크고, 17:15·21:15는 그 직전
    # 파이프라인이 아직 돌고 있을 수도 있다 — 다만 이 수집 자체가 가벼워서
    # (보통 1분 안쪽) 겹쳐도 기능적으로 문제는 없고, 그저 동시 쓰기를 최대한
    # 줄이려는 정도의 목적이다). API 호출량은 실행당 뉴스 1회·유튜브 1회뿐이라
    # (realestate_media_main.py) 하루 6회로 늘려도 네이버(하루 25,000건)·
    # 유튜브(하루 약 100회) 한도에 전혀 안 걸린다.
    - cron: '15 */4 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Create .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > pipeline/.env
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> pipeline/.env
          echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID }}" >> pipeline/.env
          echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET }}" >> pipeline/.env
          echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" >> pipeline/.env

      - name: Collect
        working-directory: pipeline
        run: python -m src.realestate_media_main

      - name: Revalidate frontend cache
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -z "$REVALIDATE_URL" ]; then
            echo "::warning::REVALIDATE_URL 시크릿 미설정 → 캐시 즉시 무효화 생략 (최대 1시간 내 자동 갱신)"
            exit 0
          fi
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_TOKEN" \
            && echo "프론트 캐시 무효화 완료" \
            || echo "::warning::캐시 무효화 호출 실패 → cacheLife에 따라 최대 1시간 내 자동 갱신"
