name: Buyback Source Probe (실제 매입량 탐색)

# 수동 실행 전용 탐색. 작업용 컨테이너는 네이버·DART 네트워크가 막혀 있어
# 응답 모양을 거기서 확인할 수 없다 — universe_probe.yml과 같은 이유·같은 방식.
#
# 목적이 "살아 있나"가 아니라 **"어떤 모양으로 오나"**라서 성패를 판정하지 않고
# 응답 구조를 찍기만 한다. 그 출력을 보고 파싱 코드를 짠다.
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/src/buyback_probe.py'
      # 파서를 고쳤을 때도 실측으로 확인해야 한다.
      - 'pipeline/src/broker_flow.py'
      - '.github/workflows/buyback_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Probe buyback volume sources
        working-directory: pipeline
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TQDM_DISABLE: '1'
        run: python -m src.buyback_probe
