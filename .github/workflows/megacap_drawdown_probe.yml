name: Megacap Drawdown Probe

# 고점 시총 500조원 이상 초대형주가 지금 하이닉스만큼(고점 대비 −50~−66%) 빠진 뒤
# 얼마나 더 빠졌는지 잰다. 야후에서 바로 받고 DB를 읽지도 쓰지도 않는다.
on:
  workflow_dispatch:
  push:
    paths:
      - 'pipeline/research/megacap_drawdown_probe.py'
      - '.github/workflows/megacap_drawdown_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pipeline dependencies
        working-directory: pipeline
        run: pip install -r requirements.txt
      - name: Measure megacap drawdowns
        working-directory: pipeline
        run: python research/megacap_drawdown_probe.py
