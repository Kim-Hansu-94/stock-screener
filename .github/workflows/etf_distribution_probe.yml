name: ETF Distribution Probe

# 490590 분배금 이력(배당락일·지급일·주당 금액)을 어디서 받을 수 있는지 **탐색**하는 진단.
# 작업 컨테이너는 네이버가 막혀 있어 거기서는 확인이 안 된다 — universe_probe와 같은
# 이유·같은 방식이다. 성패를 판정하지 않고 응답 구조와 분배·배당 관련 키만 찍는다.
on:
  push:
    paths:
      - 'pipeline/src/etf_distribution_probe.py'
      - '.github/workflows/etf_distribution_probe.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe ETF distribution sources
        working-directory: pipeline
        run: python -m src.etf_distribution_probe
