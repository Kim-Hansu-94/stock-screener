name: Check Tranche Gates

# 1~4차 분할매수 게이트에서 "구성종목 조건은 충족했는데 490590 자체 조건이 매수를
# 막은 날"이 과거에 얼마나 있었는지 재는 진단(research/checkTrancheGates.ts).
# 커버드콜 구조상 490590 자체 차트가 구성종목보다 구조적으로 뒤처질 수 있다는 우려를
# 490590 실제 일봉으로 확인한다(2026-09-17). 읽기 전용 — DB에 아무것도 쓰지 않는다.
#
# 작업 컨테이너에는 Supabase 자격증명이 없어서 거기서는 못 돌린다 — db_probe와 같은 이유.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Node 22는 .ts를 타입만 벗겨 그대로 실행한다 — classifyStage/buildTrancheGuide를
      # 화면이 쓰는 그대로 import한다.
      - name: Run diagnostic
        working-directory: frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node research/checkTrancheGates.ts
