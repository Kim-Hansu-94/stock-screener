name: ETF Distribution Probe 4

# 490590 분배금 이력 4차 탐색 — RISE 상품 코드 13개 중 490590 찾기 + KIND ETF 공시 화면의 조건 이름.
# 3차(etf_distribution_probe3)에서 RISE 상품 코드 형태와 KIND ETF 화면 주소가 확인됐다.
# 작업 컨테이너는 이 사이트들이 막혀 있어 여기서만 확인된다.
on:
  push:
    paths:
      - 'pipeline/src/etf_distribution_probe4.py'
      - '.github/workflows/etf_distribution_probe4.yml'
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe RISE product pages / KIND ETF screens
        working-directory: pipeline
        run: python -m src.etf_distribution_probe4
