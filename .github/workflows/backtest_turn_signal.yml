name: Backtest Turn Signal (one-off)

# 사용자 질문("실제로 저점 근처에서 알아차렸을지 확인해봐")에 답하기 위한 일회성
# 진단 도구. 개발 컨테이너는 외부 시세 API(FinanceDataReader/yfinance)에 대한
# 네트워크 접근이 막혀 있어, 실제 네트워크가 열려 있는 이 워크플로에서 대신 돌린다.
# 스케줄 없음 — 수동 실행(workflow_dispatch) 전용.
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run backtest
        run: python -m pipeline.research.backtest_turn_signal
