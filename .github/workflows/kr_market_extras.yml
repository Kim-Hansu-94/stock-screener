name: KR Market Extras (수급 · 컨센서스 · 자사주)

# 주식 본 파이프라인과 분리된 별도 워크플로.
# 여기가 실패했다고 매일 도는 스크리닝이 죽으면 안 되고, 갱신 주기도 다르다
# (부동산·US 재무건전성과 같은 이유·같은 구조).
#
# 17:30 KST = 08:30 UTC — 국내 장 마감(15:30) 후 수급이 확정되고, 저녁 KR 전용
# 파이프라인(16:30)이 종목을 갱신한 뒤에 돈다. 순서가 중요하다: 대상 종목을
# screened_stocks·opportunity_snapshot에서 읽으므로 그게 먼저 채워져 있어야 한다.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Collect KR market extras
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 자사주만 이 키를 쓴다. 없으면 자사주 수집만 건너뛰고 수급·컨센서스는 정상.
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TQDM_DISABLE: '1'
        run: python -m src.kr_market_extras_main

      - name: Revalidate frontend cache
        # 본 파이프라인(pipeline.yml)과 **같은 시크릿·같은 헤더**를 써야 한다.
        # 처음에 REVALIDATE_SECRET + x-revalidate-secret으로 짰다가 이 저장소의
        # 실제 규약(REVALIDATE_TOKEN + Authorization: Bearer)과 어긋나 401을
        # 받았다(2026-09-10 첫 실행). 수집은 성공했는데 화면만 최대 1시간 늦게
        # 갱신되는, 눈에 잘 안 띄는 실패였다.
        #
        # 실패해도 워크플로를 실패로 만들지 않는다 — cacheLife('hours')가 안전망이다.
        if: always()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -z "$REVALIDATE_URL" ]; then
            echo "::warning::REVALIDATE_URL 시크릿 미설정 → 캐시 즉시 무효화 생략 (최대 1시간 내 자동 갱신)"
            exit 0
          fi
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Authorization: Bearer $REVALIDATE_TOKEN" \
            && echo "프론트 캐시 무효화 완료" \
            || echo "::warning::캐시 무효화 호출 실패 → cacheLife에 따라 최대 1시간 내 자동 갱신"
