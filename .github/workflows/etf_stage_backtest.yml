name: ETF Stage Backtest

# 490590 매수체크의 A/B/C 판정(lib/etfEntryCheck.ts의 classifyStage)을 과거로 되돌려
# 돌려서 각 조건이 실제로 성과와 같은 방향인지 재는 **리서치 전용** 워크플로.
# 사이트·DB에 아무것도 쓰지 않는다 — 읽기만 하고 결과를 로그로 찍는다.
#
# 손으로만 돌린다(workflow_dispatch). 조건을 고칠 근거가 필요할 때만 쓰는 것이라
# 정기 실행할 이유가 없고, 종목당 일봉을 전부 받아 오므로 가볍지도 않다.
#
# 작업 컨테이너에는 Supabase 자격증명이 없어서 거기서는 못 돌린다 — db_probe와 같은 이유.
on:
  workflow_dispatch:
    inputs:
      source:
        description: '일봉 출처'
        required: false
        type: choice
        default: 'yfinance'
        options:
          # 유니버스 전체를 yfinance로 그때그때 받아 파일로 쓴다(DB에 안 넣는다).
          # 표본이 제일 넓다 — 기본값인 이유.
          - yfinance
          # stock_price_history만 읽는다. 빠르지만 **S&P500+NASDAQ100만** 들어 있어
          # 표본이 얇다(2026-09-16 실측: 103종목).
          - db
      lookback_days:
        description: 'yfinance로 받을 기간 (달력 일수)'
        required: false
        default: '760'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: inputs.source != 'db'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        if: inputs.source != 'db'
        working-directory: pipeline
        run: pip install -r requirements.txt

      # 왜 따로 받아서 파일로 쓰나 — stock_price_history에는 S&P500+NASDAQ100만 있다
      # (main.py의 US_OPP_INDEXES). Russell 3000은 본 파이프라인이 매 실행 받아오지만
      # **Supabase 무료 플랜 500MB** 때문에 저장하지 않는다(supabase/index_slimdown.sql:
      # 이미 426MB를 쓰고 있었고 일봉 인덱스 하나가 146MB였다). DB를 늘리는 대신
      # 백테스트 때만 받아서 파일로 읽는다 — 워크플로가 끝나면 파일도 같이 사라진다.
      - name: Dump daily bars (yfinance → file, DB에 안 씀)
        if: inputs.source != 'db'
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BARS_OUT: ${{ github.workspace }}/backtest_bars.ndjson
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m src.backtest_bars_dump

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Node 22는 .ts를 타입만 벗겨 그대로 실행한다 — classifyStage를 파이썬으로
      # 포팅하지 않고 화면이 쓰는 바로 그 함수를 import해서 재려는 것이다.
      - name: Run backtest
        working-directory: frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # 'db'를 고르면 빈 값이라 스크립트가 DB 경로로 떨어진다.
          BARS_FILE: ${{ inputs.source != 'db' && format('{0}/backtest_bars.ndjson', github.workspace) || '' }}
        run: node research/backtestEtfStage.ts
