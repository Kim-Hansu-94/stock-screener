name: ETF Stage Backtest

# 490590 매수체크의 A/B/C 판정(lib/etfEntryCheck.ts의 classifyStage)을 과거로 되돌려
# 돌려서 각 조건이 실제로 성과와 같은 방향인지 재는 **리서치 전용** 워크플로.
# 사이트·DB에 아무것도 쓰지 않는다 — 읽기만 하고 결과를 로그로 찍는다.
#
# 손으로만 돌린다(workflow_dispatch). 조건을 고칠 근거가 필요할 때만 쓰는 것이라
# 정기 실행할 이유가 없고, 종목당 일봉을 전부 받아 오므로 가볍지도 않다.
#
# 작업 컨테이너에는 Supabase 자격증명이 없어서 거기서는 못 돌린다 — db_probe와 같은 이유.
on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: '볼 종목 수 (US 시총 상위 N개, 기본 400)'
        required: false
        default: '400'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Node 22는 .ts를 타입만 벗겨 그대로 실행한다 — classifyStage를 파이썬으로
      # 포팅하지 않고 화면이 쓰는 바로 그 함수를 import해서 재려는 것이다.
      - name: Run backtest
        working-directory: frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAX_TICKERS: ${{ inputs.max_tickers }}
        run: node research/backtestEtfStage.ts
