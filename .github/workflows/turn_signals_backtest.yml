name: Turn Signals Backtest

# "하락이 멈추고 상승으로 돌아섰다"를 잡는 **매수 트리거 후보**들을 과거로 되돌려 재는
# 리서치 전용 워크플로. 읽기만 한다 — DB·사이트에 아무것도 쓰지 않는다.
#
# support_signals_backtest.yml과 질문이 다르다: 그쪽은 "조건이 켜져 있는 상태"를 재고
# 이쪽은 "오늘 처음 일어난 사건"을 잰다. 매수 신호는 사건이라 샘플링 설계가 달라야 한다.
on:
  workflow_dispatch:
    inputs:
      market:
        description: '시장'
        required: false
        type: choice
        default: 'KR'
        options:
          - KR
          - US
      drawdown_gate:
        description: '하락 국면 게이트 (120봉 고점 대비 %)'
        required: false
        default: '15'
  push:
    paths:
      - 'frontend/research/backtestTurnSignals.ts'
      - '.github/workflows/turn_signals_backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Backtest turn signals
        working-directory: frontend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARKET: ${{ inputs.market || 'KR' }}
          DRAWDOWN_GATE: ${{ inputs.drawdown_gate || '15' }}
        run: node --import ./research/resolveTsImports.mjs research/backtestTurnSignals.ts
