name: US Universe Source Probe

# 수동 실행 전용 진단. 작업용 컨테이너는 ETF·시세 사이트 네트워크가 막혀 있어
# Russell 3000 소스가 살아 있는지 거기서 확인할 수 없다 — 본 파이프라인(22분)을
# 돌려가며 확인하는 대신 여기서 1분 만에 소스별 결과를 본다.
# (backtest_turn_signal.yml과 같은 이유·같은 방식의 진단 워크플로다.)
on:
  workflow_dispatch:
  # 유니버스 수집 코드를 건드리면 자동으로 한 번 두드려 본다 — 소스가 조용히
  # 막히는 게 이 파일의 고질적인 실패 방식이라, 고친 직후 실제로 되는지
  # 확인하지 않으면 또 몇 주를 모르고 지나간다.
  push:
    paths:
      - 'pipeline/src/universe_us.py'
      - '.github/workflows/universe_probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pipeline/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Probe Russell 3000 sources
        working-directory: pipeline
        # FinanceDataReader가 진행률 표시줄을 수백 줄 쏟아내 앞선 소스 결과를
        # 로그에서 밀어낸다. 진단 실행에서는 꺼 둔다.
        env:
          TQDM_DISABLE: '1'
        run: python -m src.universe_us
